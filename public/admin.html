<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de leads · Cali Clean</title>
<meta name="robots" content="noindex,nofollow">
<style>
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f1f5f9;color:#0f172a;font-size:14px}
  header{background:#0f172a;color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  header h1{margin:0;font-size:17px;font-weight:700}
  header .r{display:flex;gap:9px;align-items:center}
  header a,header button{background:#1e293b;color:#e2e8f0;border:none;border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;text-decoration:none;font-family:inherit}
  header a:hover,header button:hover{background:#334155}
  .wrap{padding:20px;max-width:1500px;margin:0 auto}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px;margin-bottom:20px}
  .kpi{background:#fff;border-radius:12px;padding:16px 18px;border:1px solid #e2e8f0}
  .kpi b{display:block;font-size:25px;font-weight:800;letter-spacing:-.7px;margin-bottom:2px}
  .kpi span{color:#64748b;font-size:12.5px}
  .kpi.hot b{color:#dc2626}.kpi.money b{color:#0f766e}
  .bar{background:#fff;border-radius:12px;padding:13px 16px;border:1px solid #e2e8f0;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  select,input[type=search]{border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 11px;font-size:13.5px;font-family:inherit;background:#fff}
  input[type=search]{min-width:210px}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0}
  th{text-align:left;padding:11px 13px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:#64748b;background:#f8fafc;border-bottom:1px solid #e2e8f0;white-space:nowrap}
  td{padding:11px 13px;border-bottom:1px solid #f1f5f9;vertical-align:top}
  tr:hover td{background:#f8fafc;cursor:pointer}
  .score{display:inline-flex;align-items:center;justify-content:center;min-width:38px;padding:3px 8px;border-radius:20px;font-weight:800;font-size:12.5px}
  .hot{background:#fee2e2;color:#b91c1c}.warm{background:#fef3c7;color:#92400e}.cold{background:#e0f2fe;color:#0369a1}
  .pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:650;background:#e2e8f0;color:#475569}
  .st-new{background:#dbeafe;color:#1d4ed8}.st-engaged{background:#ddd6fe;color:#6d28d9}.st-contacted{background:#fef3c7;color:#92400e}
  .st-booked,.st-won{background:#d1fae5;color:#047857}.st-lost,.st-spam{background:#f1f5f9;color:#64748b}
  .em{color:#0f766e;text-decoration:none}
  .muted{color:#94a3b8;font-size:12.5px}
  dialog{border:none;border-radius:16px;padding:0;max-width:620px;width:94%;box-shadow:0 20px 60px rgba(15,23,42,.3)}
  dialog::backdrop{background:rgba(15,23,42,.55)}
  .dh{background:#0f766e;color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .dh h2{margin:0;font-size:18px}
  .dh button{background:rgba(255,255,255,.2);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px}
  .db{padding:20px 22px;max-height:66vh;overflow:auto}
  .row{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13.5px}
  .row span:first-child{color:#64748b;min-width:132px}
  .sec{margin-top:18px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:#64748b}
  .df{padding:16px 22px;background:#f8fafc;border-top:1px solid #e2e8f0;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .df button{background:#0f766e;color:#fff;border:none;border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
  textarea{width:100%;border:1.5px solid #e2e8f0;border-radius:9px;padding:10px;font-family:inherit;font-size:13.5px;min-height:62px;margin-top:8px}
  .empty{padding:44px;text-align:center;color:#94a3b8;background:#fff;border-radius:12px;border:1px solid #e2e8f0}
  .spark{display:flex;align-items:flex-end;gap:2px;height:34px;margin-top:8px}
  .spark i{flex:1;background:#5eead4;border-radius:2px 2px 0 0;min-height:2px}
</style>
</head>
<body>
<header>
  <h1>🧼 Cali Clean · Leads</h1>
  <div class="r">
    <select id="days">
      <option value="7">7 días</option><option value="30" selected>30 días</option>
      <option value="90">90 días</option><option value="365">12 meses</option>
    </select>
    <button id="runSeq" title="Procesa los correos de seguimiento pendientes">▶ Secuencias</button>
    <a href="/api/admin/export.csv">⬇ CSV</a>
    <a href="/api/admin/health" target="_blank">⚙ Estado</a>
  </div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar nombre, email, teléfono, ZIP…">
    <select id="fStatus"><option value="">Todos los estados</option>
      <option value="new">Nuevo</option><option value="engaged">Interesado</option>
      <option value="contacted">Contactado</option><option value="quoted">Cotizado</option>
      <option value="booked">Agendado</option><option value="won">Ganado</option>
      <option value="lost">Perdido</option><option value="spam">Spam</option></select>
    <select id="fTemp"><option value="">Toda temperatura</option>
      <option value="hot">🔥 Caliente</option><option value="warm">🌤 Tibio</option><option value="cold">❄️ Frío</option></select>
    <select id="fSeg"><option value="">Todos los segmentos</option>
      <option value="residential">Residencial</option><option value="commercial">Comercial</option></select>
    <span class="muted" id="count"></span>
  </div>
  <div id="tableBox"></div>
</div>

<dialog id="dlg"><div id="dlgContent"></div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const api = (p, o) => fetch('/api/admin' + p, o).then(r => r.json());
const money = (n) => '$' + Number(n || 0).toLocaleString('en-US');
const fmt = (d) => d ? new Date(d.replace(' ', 'T') + 'Z').toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STATUS_ES = { new: 'Nuevo', engaged: 'Interesado', contacted: 'Contactado', quoted: 'Cotizado', booked: 'Agendado', won: 'Ganado', lost: 'Perdido', spam: 'Spam' };

async function loadStats() {
  const s = await api('/stats?days=' + $('#days').value);
  const openRate = s.emails.sent ? Math.round((s.emails.opened / s.emails.sent) * 100) : 0;
  const max = Math.max(1, ...s.daily.map(d => d.n));
  $('#kpis').innerHTML = `
    <div class="kpi"><b>${s.totals.leads}</b><span>leads en ${s.days} días</span>
      <div class="spark">${s.daily.map(d => `<i style="height:${(d.n / max) * 100}%" title="${d.day}: ${d.n}"></i>`).join('')}</div></div>
    <div class="kpi money"><b>${money(s.totals.pipeline)}</b><span>pipeline (por visita)</span></div>
    <div class="kpi money"><b>${money(s.totals.annual_pipeline)}</b><span>valor anual potencial</span></div>
    <div class="kpi hot"><b>${(s.byTemperature.find(t => t.temperature === 'hot') || {}).n || 0}</b><span>leads calientes</span></div>
    <div class="kpi"><b>${s.conversion}%</b><span>conversión a ganado</span></div>
    <div class="kpi"><b>${money(s.won.revenue)}</b><span>ganado (${s.won.n})</span></div>
    <div class="kpi"><b>${openRate}%</b><span>apertura · ${s.emails.sent} correos</span></div>
    <div class="kpi"><b>${s.totals.avg_score}</b><span>score promedio</span></div>`;
}

async function loadLeads() {
  const p = new URLSearchParams();
  if ($('#q').value) p.set('q', $('#q').value);
  if ($('#fStatus').value) p.set('status', $('#fStatus').value);
  if ($('#fTemp').value) p.set('temperature', $('#fTemp').value);
  if ($('#fSeg').value) p.set('segment', $('#fSeg').value);
  const r = await api('/leads?' + p);
  $('#count').textContent = r.total + ' leads';
  if (!r.leads.length) { $('#tableBox').innerHTML = '<div class="empty">Sin leads todavía. Publica el widget y empieza a recibirlos.</div>'; return; }
  $('#tableBox').innerHTML = `<table><thead><tr>
      <th>Score</th><th>Contacto</th><th>Servicio</th><th>Estimado</th><th>Anual</th><th>Estado</th><th>Origen</th><th>Fecha</th>
    </tr></thead><tbody>${r.leads.map(l => `
      <tr data-uid="${l.uid}">
        <td><span class="score ${l.temperature}">${l.score}</span></td>
        <td><strong>${esc(l.name || '—')}</strong><br>
            <a class="em" href="mailto:${esc(l.email)}" onclick="event.stopPropagation()">${esc(l.email)}</a>
            ${l.phone ? `<br><a class="em" href="tel:${esc(l.phone)}" onclick="event.stopPropagation()">${esc(l.phone)}</a>` : '<br><span class="muted">sin teléfono</span>'}
            ${l.zip ? `<br><span class="muted">${esc(l.zip)}${l.in_service_area ? '' : ' ⚠️'}</span>` : ''}</td>
        <td>${esc(l.segment === 'commercial' ? 'Comercial' : 'Residencial')}<br>
            <span class="muted">${esc(l.service_type || '')} · ${esc(l.frequency || '')}</span></td>
        <td><strong>${money(l.quote_price)}</strong></td>
        <td>${l.annual_value ? money(l.annual_value) : '—'}</td>
        <td><span class="pill st-${l.status}">${STATUS_ES[l.status] || l.status}</span>${l.unsubscribed ? '<br><span class="muted">baja</span>' : ''}</td>
        <td><span class="muted">${esc(l.utm_source || 'directo')}<br>${esc(l.utm_campaign || '')}</span></td>
        <td><span class="muted">${fmt(l.created_at)}</span></td>
      </tr>`).join('')}</tbody></table>`;
  document.querySelectorAll('tr[data-uid]').forEach(tr => tr.onclick = () => openLead(tr.dataset.uid));
}

async function openLead(uid) {
  const d = await api('/leads/' + uid);
  const l = d.lead;
  const row = (k, v) => `<div class="row"><span>${k}</span><span>${v}</span></div>`;
  $('#dlgContent').innerHTML = `
    <div class="dh"><div><h2>${esc(l.name || l.email)}</h2>
      <div style="opacity:.85;font-size:13px;margin-top:3px">Score ${l.score}/100 · ${l.temperature} · ${money(l.quote_price)}</div></div>
      <button onclick="document.getElementById('dlg').close()">×</button></div>
    <div class="db">
      ${row('Email', `<a class="em" href="mailto:${esc(l.email)}">${esc(l.email)}</a>`)}
      ${row('Teléfono', l.phone ? `<a class="em" href="tel:${esc(l.phone)}">${esc(l.phone)}</a>` : '—')}
      ${row('ZIP / dirección', esc([l.zip, l.address].filter(Boolean).join(' · ') || '—') + (l.in_service_area ? '' : ' ⚠️ fuera de área'))}
      ${row('Servicio', `${esc(l.segment)} · ${esc(l.service_type || '')} · ${esc(l.frequency || '')}`)}
      ${row('Tamaño', esc(l.quote?.size || '—'))}
      ${row('Extras', l.addons?.length ? esc(l.addons.join(', ')) : '—')}
      ${row('Estimado', `${money(l.quote_low)} – ${money(l.quote_high)}`)}
      ${row('Valor anual', money(l.annual_value))}
      ${row('Fecha deseada', esc(l.preferred_date || '—'))}
      ${row('Idioma', l.locale === 'es' ? 'Español' : 'English')}
      ${row('Origen', `${esc(l.source || '')} · ${esc(l.utm_source || 'directo')} / ${esc(l.utm_campaign || '—')}`)}
      ${row('Página', esc(l.landing_page || '—'))}
      ${l.message ? row('Mensaje', esc(l.message)) : ''}
      <div class="sec">Por qué puntúa ${l.score}</div>
      ${(l.score_reasons || []).map(r => `<div class="row"><span>${r.points > 0 ? '+' : ''}${r.points}</span><span>${esc(r.reason)}</span></div>`).join('')}
      <div class="sec">Correos (${d.emails.length})</div>
      ${d.emails.map(e => `<div class="row"><span>${esc(e.template)}</span><span>${fmt(e.created_at)} · ${e.status}${e.opened_at ? ' · abierto 👁' : ''}${e.clicked_at ? ' · clic 🖱' : ''}${e.error ? ` · <span style="color:#b91c1c">${esc(e.error)}</span>` : ''}</span></div>`).join('') || '<div class="row"><span class="muted">Ninguno todavía</span></div>'}
      <div class="sec">Secuencia programada</div>
      ${d.steps.map(s => `<div class="row"><span>${esc(s.step)}</span><span>${fmt(s.scheduled_at)} · ${s.status}</span></div>`).join('') || '<div class="row"><span class="muted">Sin pasos</span></div>'}
      <div class="sec">Notas internas</div>
      <textarea id="notes" placeholder="Qué se habló, cuándo llamar, objeciones…">${esc(l.notes || '')}</textarea>
    </div>
    <div class="df">
      <select id="newStatus">${Object.entries(STATUS_ES).map(([k, v]) => `<option value="${k}"${k === l.status ? ' selected' : ''}>${v}</option>`).join('')}</select>
      <button id="save">Guardar</button>
      ${l.phone ? `<a href="tel:${esc(l.phone)}" style="text-decoration:none;color:#0f766e;font-weight:600;padding:10px">📞 Llamar</a>` : ''}
      <a href="mailto:${esc(l.email)}" style="text-decoration:none;color:#0f766e;font-weight:600;padding:10px">✉️ Responder</a>
    </div>`;
  $('#dlg').showModal();
  $('#save').onclick = async () => {
    await api('/leads/' + uid, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: $('#newStatus').value, notes: $('#notes').value }),
    });
    $('#dlg').close();
    loadLeads(); loadStats();
  };
}

let debounce;
$('#q').oninput = () => { clearTimeout(debounce); debounce = setTimeout(loadLeads, 280); };
['#fStatus', '#fTemp', '#fSeg'].forEach(s => { $(s).onchange = loadLeads; });
$('#days').onchange = loadStats;
$('#runSeq').onclick = async () => {
  $('#runSeq').disabled = true;
  const r = await api('/run-sequences', { method: 'POST' });
  $('#runSeq').disabled = false;
  alert(`Enviados: ${r.result.sent} · Diferidos: ${r.result.deferred} · Fallidos: ${r.result.failed} · Omitidos: ${r.result.skipped}`);
  loadLeads();
};
loadStats(); loadLeads();
setInterval(() => { loadStats(); loadLeads(); }, 60000);
</script>
</body>
</html>
